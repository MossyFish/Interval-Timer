<body>

<div class="frame">
  <div class="titlebar">
    <span class="sq"></span>
    <h1 id="tbTitle">INTERVAL</h1>
    <button class="tbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">&#10022;</button>
    <button class="tbtn" id="closeBtn" title="Back" aria-label="Back">&#10005;</button>
  </div>

  <div class="panel">

      <section class="screen on" id="editor">
      <div>
        <label class="lbl" for="wname">Workout name</label>
        <input type="text" id="wname" autocomplete="off" spellcheck="false" placeholder="ABS WORKOUT">
      </div>

      <div>
        <label class="lbl" for="src">Routine</label>
        <textarea id="src" spellcheck="false" autocapitalize="off"></textarea>
        <p class="hint">
          One per line: NAME DURATION x SETS.<br>
          Reads 30s / 45 / 1m / 1m30s / 2 min. Sets optional.<br>
          Lines starting with # are skipped.
        </p>
      </div>

      <div>
        <span class="lbl">Parsed</span>
        <div class="plist" id="parsed"></div>
      </div>

      <div class="tot"><span>Total</span><b id="total">0:00</b></div>

      <button class="btn primary" id="go" style="width:100%;font-size:16px;padding:14px" disabled>START</button>

      <div class="row">
        <button class="btn" id="save">Save</button>
      </div>

      <div id="savedwrap" style="display:none">
        <span class="lbl">Saved</span>
        <div class="chips" id="saved"></div>
      </div>
    </section>

    <section class="screen" id="runner">
      <div class="aflag" id="aflag"></div>
      <div class="wname" id="rWorkout">WORKOUT</div>

      <div class="dialwrap" id="dialwrap">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="43"></circle>
          <circle class="dialface" cx="50" cy="50" r="36"></circle>
          <circle class="ring-progress" id="ringProgress" cx="50" cy="50" r="43"></circle>
        </svg>
        <div class="digits" id="digits">0</div>
      </div>

      <div class="cur" id="rCur">READY</div>
      <div class="nxt" id="rNxtWrap"><em>NXT</em><span id="rNxt">&#8212;</span></div>
      <div class="setc" id="rSet"></div>

      <div class="ctrls">
        <button class="btn" id="cBack">Prev</button>
        <button class="btn primary" id="cPause">Pause</button>
        <button class="btn" id="cSkip">Skip</button>
      </div>

      <div class="prog"><i id="bar"></i></div>
    </section>
  </div>

  <div class="footbar">
    <span class="blk"></span>
    <span class="grow"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
</div>

<script>if (location.protocol !== "file:" && "serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));</script>
</body>
